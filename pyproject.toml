[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-motion"
version = "0.1.0"
description = "Reimplementation of conditional flow for motion generation, editing, and intra-structural retargeting"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.8.0",
  "numpy==1.26.4",
  "scipy==1.16.3",
  "transformers==4.57.1",
  "sentencepiece==0.2.1",
  "tqdm==4.67.1",
]

[tool.setuptools.packages.find]
include = ["unified_motion*"]

[tool.ruff]
line-length = 100
target-version = "py311"
